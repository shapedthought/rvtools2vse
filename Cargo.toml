[package]
name = "rvsum"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "Quick, offline summaries of RVTools exports for backup sizing"
repository = "https://github.com/shapedthought/rvsum"
readme = "README.md"
license = "MIT"
authors = ["Ed Howard"]
keywords = ["rvtools", "vmware", "veeam", "sizing"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calamine = "0.38"
anyhow = "1.0.100"
# office = "0.8.1"
itertools = "0.10.5"
serde = {version = "1.0.152", features = ["derive"]}
clap = { version = "4.1.6", features = ["derive"] }
serde_json = "1.0.93"
comfy-table = "6.1.4"
thiserror = "1.0.38"
derive-new = "0.5.9"
termplot = "0.1.1"
regex = "1.9.5"
fastmurmur3 = "0.2.0"
csv = "1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
dirs = "6"
sha2 = "0.10"
tempfile = "3"
arrow-array = "57"
arrow-schema = "57"
parquet = { version = "57", default-features = false, features = ["arrow", "snap"] }

[profile.release]
strip = true
opt-level = "z"
lto = true

[lints.clippy]
too_many_arguments = "allow"
